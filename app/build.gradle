plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.car.dockbar'
    compileSdk 34

    // Native 崩溃捕获需要 NDK（走 ndk-build，本机未装 CMake）
    ndkVersion "28.2.13676358"

    defaultConfig {
        applicationId "com.car.dockbar"
        minSdk 28
        targetSdk 34
        versionCode 470
        versionName "4.7.0-next"
        resConfigs "zh", "en"

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
        externalNativeBuild {
            ndkBuild {
                arguments "APP_PLATFORM=android-28"
            }
        }
    }

    externalNativeBuild {
        ndkBuild {
            path file('src/main/jni/Android.mk')
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            // Release 启用代码缩减、混淆和资源缩减。反射和 JNI 保留规则见 proguard-rules.pro。
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // 本地 Release 使用 Debug 签名，GitHub Actions 发布前重新签名。
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packaging {
        resources {
            excludes += ['META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = variant.buildType.name == 'release' ?
                    "Banana_Dock-${variant.versionName}.apk" : "Banana_Dock-${variant.versionName}-debug.apk"
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    // android.jar 里的 org.json 是桩，单元测试要换成真实现。车上仍用系统自带的 org.json。
    testImplementation 'org.json:json:20240303'
}
